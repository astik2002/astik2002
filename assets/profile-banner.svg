<svg width="1280" height="420" viewBox="0 0 1280 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Astik GitHub Profile Banner</title>
  <desc id="desc">A developer profile banner for Astik, Java Developer at Mejora Infotech.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#020617"/>
      <stop offset="0.5" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="119" y1="82" x2="1110" y2="330" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8"/>
      <stop offset="0.48" stop-color="#F97316"/>
      <stop offset="1" stop-color="#22C55E"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="1280" height="420" rx="28" fill="url(#bg)"/>
  <circle cx="116" cy="70" r="170" fill="#38BDF8" fill-opacity="0.1"/>
  <circle cx="1108" cy="72" r="196" fill="#F97316" fill-opacity="0.1"/>
  <circle cx="1056" cy="410" r="210" fill="#22C55E" fill-opacity="0.08"/>
  <path d="M0 336C164 258 284 268 422 310C559 351 669 400 831 288C954 203 1036 120 1280 162" stroke="url(#accent)" stroke-width="5" stroke-opacity="0.5"/>

  <g transform="translate(84 78)">
    <rect width="120" height="120" rx="30" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.12"/>
    <text x="29" y="76" fill="#F8FAFC" font-family="Consolas, Menlo, monospace" font-size="50" font-weight="700">{ }</text>
  </g>

