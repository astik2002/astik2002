    <text x="28" y="25" fill="#FED7AA" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">Java</text>
    <rect x="132" width="154" height="38" rx="19" fill="#22C55E" fill-opacity="0.14" stroke="#4ADE80" stroke-opacity="0.5"/>
    <text x="158" y="25" fill="#DCFCE7" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">Spring Boot</text>
    <rect x="302" width="118" height="38" rx="19" fill="#38BDF8" fill-opacity="0.14" stroke="#7DD3FC" stroke-opacity="0.5"/>
    <text x="329" y="25" fill="#E0F2FE" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">React</text>
    <rect x="436" width="124" height="38" rx="19" fill="#A855F7" fill-opacity="0.14" stroke="#C084FC" stroke-opacity="0.5"/>
    <text x="463" y="25" fill="#F3E8FF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">Python</text>
    <rect x="576" width="94" height="38" rx="19" fill="#64748B" fill-opacity="0.16" stroke="#CBD5E1" stroke-opacity="0.35"/>
    <text x="604" y="25" fill="#E2E8F0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">JDBC</text>
  </g>

  <g transform="translate(888 56)" filter="url(#shadow)">
    <rect width="298" height="208" rx="24" fill="#FFFFFF" fill-opacity="0.09" stroke="#FFFFFF" stroke-opacity="0.16"/>
    <text x="26" y="42" fill="#F8FAFC" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="800">Current Focus</text>
    <rect x="26" y="68" width="246" height="34" rx="12" fill="#020617" fill-opacity="0.62"/>
    <circle cx="46" cy="85" r="6" fill="#22C55E"/>
    <text x="62" y="91" fill="#CBD5E1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13">Loan based Spring Boot app</text>
    <rect x="26" y="116" width="246" height="34" rx="12" fill="#020617" fill-opacity="0.62"/>
    <circle cx="46" cy="133" r="6" fill="#38BDF8"/>
    <text x="62" y="139" fill="#CBD5E1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13">ETL and backend workflows</text>
    <rect x="26" y="164" width="246" height="34" rx="12" fill="#020617" fill-opacity="0.62"/>
    <circle cx="46" cy="181" r="6" fill="#F97316"/>
    <text x="62" y="187" fill="#CBD5E1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13">Java APIs and database logic</text>
