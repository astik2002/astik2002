    <text y="58" fill="#CBD5E1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24">Java Developer at Mejora Infotech</text>
    <text y="110" fill="#94A3B8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19">Backend systems, Spring Boot APIs, ETL workflows,</text>
    <text y="138" fill="#94A3B8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19">database logic, and React interfaces.</text>
  </g>

